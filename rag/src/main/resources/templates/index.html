<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Local RAG Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 70%;
            padding: 10px;
        }

        input[type="file"] {
            margin: 10px 0;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            background: #eef7ee;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            background: #fdecec;
        }

        .answer {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<h1>Local RAG Assistant</h1>

<div class="section">

    <h2>Upload Document</h2>

    <form method="post"
          action="/upload"
          enctype="multipart/form-data">

        <input type="file"
               name="file"
               accept=".txt"
               required>

        <br>

        <button type="submit">
            Upload & Index
        </button>

    </form>

    <div class="message"
         th:if="${message}"
         th:text="${message}">
    </div>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

</div>


<div class="section">

    <h2>Ask the Knowledge Base</h2>

    <form method="post" action="/ask">

        <input type="text"
               name="question"
               placeholder="Ask something..."
               th:value="${question}"
               required>

        <button type="submit">
            Ask
        </button>

    </form>

    <div class="answer"
         th:if="${answer}">

        <strong>Answer:</strong>

        <p th:text="${answer}"></p>

    </div>

</div>

</body>

</html>
