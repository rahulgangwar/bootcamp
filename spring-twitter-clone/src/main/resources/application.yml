# Server Configuration
server:
  port: 8080
  # servlet:
  #   context-path: /api

# Database Configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/main_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  grpc:
    client:
      channels:
        product-service:
          address: static://localhost:9090

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML


  # Spring DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true



# Logging Configuration
logging:
  level:
    com.example: DEBUG
    org.springframework.security: DEBUG


# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
