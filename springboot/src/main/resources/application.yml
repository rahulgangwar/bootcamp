# Server Configuration
server:
  port: 8080
  # servlet:
  #   context-path: /api

# Database Configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/main_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379


  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML


  # Spring DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true


# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000
  refresh:
    expiration: 604800000


# Application Configuration
app:
  email:
    from: noreply@todoapp.com
    verification:
      expiration: 86400000

  frontend:
    url: http://localhost:3000


# Logging Configuration
logging:
  level:
    com.example: DEBUG
    org.springframework.security: DEBUG


# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

# Security Configuration
security:
  enabled: false

  public-endpoints:
    - /home
    - /page/**
    - /auth/**
    - /api/auth/**
    - /error
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /api-docs/**
    - /swagger-resources/**
    - /webjars/**-
    - /actuator/health

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200

    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS

    allowed-headers:
      - "*"
    allow-credentials: true
    exposed-headers:
      - Authorization